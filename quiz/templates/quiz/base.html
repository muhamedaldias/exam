<!DOCTYPE html>
<html lang="{{ LANG|default:'en' }}" dir="{% if RTL %}rtl{% else %}ltr{% endif %}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Online Quiz Assessment System{% endblock %}</title>
    {% if RTL %}
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    {% endif %}
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- AOS Animation Library -->
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    
    <style>
        [x-cloak] { display: none !important; }
        {% if RTL %}
        body { font-family: 'Cairo', 'Segoe UI', Tahoma, sans-serif; }
        [dir="rtl"] .space-x-2 > :not([hidden]) ~ :not([hidden]),
        [dir="rtl"] .space-x-3 > :not([hidden]) ~ :not([hidden]),
        [dir="rtl"] .space-x-4 > :not([hidden]) ~ :not([hidden]) { --tw-space-x-reverse: 1 !important; }
        [dir="rtl"] .text-left { text-align: right; }
        [dir="rtl"] .border-l-4 { border-left-width: 0; border-right-width: 4px; }
        [dir="rtl"] .ml-7 { margin-left: 0; margin-right: 1.75rem; }
        [dir="rtl"] .mr-1 { margin-right: 0; margin-left: 0.25rem; }
        [dir="rtl"] .mr-2 { margin-right: 0; margin-left: 0.5rem; }
        {% endif %}
    </style>
    
    {% block extra_css %}{% endblock %}
</head>
<body class="bg-gray-50 min-h-screen">
    {% if SHOW_LANG_TOGGLE %}
    <a href="{% if LANG == 'ar' %}{% url 'quiz:set_language' 'en' %}{% else %}{% url 'quiz:set_language' 'ar' %}{% endif %}?next={{ request.path }}"
       class="fixed bottom-5 end-5 z-[60] flex items-center gap-2 px-4 py-2.5 bg-gray-900 hover:bg-blue-700 text-white text-sm font-semibold rounded-full shadow-xl transition transform hover:scale-105">
        <i data-lucide="globe" class="w-4 h-4"></i>
        <span>{{ T.toggle_to }}</span>
    </a>
    {% endif %}
    {% block content %}{% endblock %}
    
    <script>
        // Initialize with error handling
        document.addEventListener('DOMContentLoaded', function() {
            try {
                // Initialize AOS animations
                if (typeof AOS !== 'undefined') {
                    AOS.init({
                        duration: 800,
                        once: true,
                        offset: 100
                    });
                }
                
                // Initialize Lucide icons
                if (typeof lucide !== 'undefined') {
                    lucide.createIcons();
                }
            } catch (error) {
                console.warn('Animation libraries failed to load:', error);
            }
        });
        
        // Global: copy quiz code helper
        window.copyCode = function(elOrText, maybeEl) {
            let text = elOrText;
            let el = maybeEl || elOrText;
            if (typeof elOrText === 'object' && elOrText.textContent) {
                text = elOrText.textContent.trim();
                el = elOrText;
            }
            navigator.clipboard.writeText(text).then(() => {
                const origText = el.textContent;
                el.textContent = text + ' ✓';
                setTimeout(() => { el.textContent = origText; }, 1200);
            }).catch(() => { prompt('Copy:', text); });
        };
        
        // Check if Alpine loaded after 2 seconds
        setTimeout(function() {
            if (typeof Alpine === 'undefined') {
                console.warn('Alpine.js failed to load from CDN');
                // Remove x-cloak to show content anyway
                document.querySelectorAll('[x-cloak]').forEach(function(el) {
                    el.removeAttribute('x-cloak');
                    el.style.display = 'block';
                });
            }
        }, 2000);
    </script>
    
    {% block extra_js %}{% endblock %}

    <footer class="text-center text-xs text-gray-400 py-4">
        OQA System — Open Source • <a href="https://github.com" class="underline">Pro available</a>
    </footer>
</body>
</html>
